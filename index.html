        /* Smooth transitions */

        /* Simple fade animation */

            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade {
            animation: fadeIn 0.5s ease forwards;
        }

        .animate-fade-delay-1 {

            opacity: 0;
        }

        .animate-fade-delay-2 {

            opacity: 0;
        }

            animation-delay: 0.3s;
            opacity: 0;
        }

                                target={product.demoLink.startsWith('mailto') || product.demoLink.startsWith('tel') ? "_self" : "_blank"}
                                rel="noopener noreferrer"
                                style={{
                                    display: 'inline-flex',
                                    alignItems: 'center',
                                    gap: '10px',
                                    padding: '16px 32px',
                                    borderRadius: '8px',
                                    background: '#1b2955',
                                    color: '#fff',
                                    fontSize: '15px',
                                    fontWeight: 600,
                                    textDecoration: 'none',
                                    transition: 'all 0.2s'
                                }}
                                onMouseEnter={(e) => {
                                    e.currentTarget.style.background = '#2a3b75';
                                    e.currentTarget.style.transform = 'translateY(-2px)';
                                }}
                                onMouseLeave={(e) => {
                                    e.currentTarget.style.background = '#1b2955';
                                    e.currentTarget.style.transform = 'translateY(0)';
                                }}
                            >
                                {product.buttonText}
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <path d={Icons.arrowRight} />
                                </svg>
                            </a>



                            {/* Extra Buttons */}
                            {product.extraButtons && (
                                <div style={{ display: 'flex', gap: '12px', marginTop: '12px', justifyContent: 'center', flexWrap: 'wrap' }}>
                                    {product.extraButtons.map((btn, idx) => (
                                        <a
                                            key={idx}
                                            href={btn.link}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            style={{
                                                padding: '8px 16px',
                                                borderRadius: '6px',
                                                background: 'transparent',
                                                border: `1px solid ${isDark ? 'rgba(255,255,255,0.2)' : '#e5e7eb'}`,
                                                color: isDark ? '#9ca3af' : '#6b7280',
                                                fontSize: '13px',
                                                fontWeight: 500,
                                                textDecoration: 'none',
                                                transition: 'all 0.2s'
                                            }}
                                            onMouseEnter={(e) => {
                                                e.currentTarget.style.borderColor = '#faa31a';
                                                e.currentTarget.style.color = '#faa31a';
                                            }}
                                            onMouseLeave={(e) => {
                                                e.currentTarget.style.borderColor = isDark ? 'rgba(255,255,255,0.2)' : '#e5e7eb';
                                                e.currentTarget.style.color = isDark ? '#9ca3af' : '#6b7280';
                                            }}
                                        >
                                            {btn.text}
                                        </a>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div >
            );
        };

        // Main App
        const App = () => {
            const [isDark, setIsDark] = useState(false);
            const [currentSlide, setCurrentSlide] = useState(0);
            const [isAnimating, setIsAnimating] = useState(false);

            const totalSlides = PRODUCTS.length + 1;

            // Apply dark mode to body
            useEffect(() => {
                document.body.classList.toggle('dark', isDark);
            }, [isDark]);

            // Navigation
            const goToSlide = useCallback((index) => {
                if (isAnimating || index < 0 || index >= totalSlides) return;
                setIsAnimating(true);
                setCurrentSlide(index);
                setTimeout(() => setIsAnimating(false), 400);
            }, [isAnimating, totalSlides]);

            const goNext = useCallback(() => goToSlide(currentSlide + 1), [currentSlide, goToSlide]);
            const goPrev = useCallback(() => goToSlide(currentSlide - 1), [currentSlide, goToSlide]);
            const goHome = useCallback(() => goToSlide(0), [goToSlide]);

            // Keyboard
            useEffect(() => {
                const handleKey = (e) => {
                    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goNext(); }
                    else if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
                    else if (e.key === 'Escape' || e.key === 'Home') { e.preventDefault(); goHome(); }
                    else if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, [goNext, goPrev, goHome]);

            // Fullscreen
            const toggleFullscreen = () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen();
                else document.exitFullscreen();
            };

            return (
                <div style={{
                    height: '100vh',
                    width: '100vw',
                    overflow: 'hidden',
                    background: isDark ? '#111827' : '#fff'
                }}>
                    <Header
                        isDark={isDark}
                        onToggle={() => setIsDark(!isDark)}
                        currentSlide={currentSlide}
                        totalSlides={totalSlides}
                        onHome={goHome}
                        onFullscreen={toggleFullscreen}
                    />

                    <main style={{ height: '100%', width: '100%' }} className="slide-transition">
                        {currentSlide === 0 ? (
                            <OverviewSlide isDark={isDark} onSelect={goToSlide} />
                        ) : (
                            <ProductSlide
                                product={PRODUCTS[currentSlide - 1]}
                                isDark={isDark}
                                slideNumber={currentSlide}
                            />
                        )}
                    </main>

                    <NavFooter
                        isDark={isDark}
                        currentSlide={currentSlide}
                        totalSlides={totalSlides}
                        onPrev={goPrev}
                        onNext={goNext}
                        onGoTo={goToSlide}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
